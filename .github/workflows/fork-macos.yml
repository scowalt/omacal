# This fork's main, built for the two Macs it runs on — an M3 Pro MacBook Pro
# and an A18 Pro MacBook Neo — and published as this fork's latest release,
# which the installed app updates itself from. Fork-only: upstream never
# touches this file, so rebasing main onto upstream never conflicts with it.
#
# One aarch64-apple-darwin build serves both machines. Rust's default CPU for
# that target is the M1, and both chips run everything an M1 does.
#
# Each build is versioned `<upstream version>-fork.<run number>`, so every
# build is newer than the last, and a rebase onto a newer upstream is newer
# still. The run number belongs to this file: renaming it restarts the count,
# and installed builds then see no update until reinstalled by hand.
#
# How this differs from upstream's release.yml. The differences are applied
# at build time — a --config overlay and two compile-time variables — so no
# source file diverges from upstream for them:
#   - ad-hoc signed ("-"), not Developer ID: the fork has no Apple
#     certificate. Downloads made with curl or gh carry no quarantine flag,
#     so Gatekeeper never sees them; a browser download needs "Open Anyway"
#     in System Settings > Privacy & Security.
#   - updates come from this fork. The updater endpoint and pubkey in the
#     overlay are the fork's, and the update notice's endpoint is set by
#     OMACAL_LATEST_RELEASE_ENDPOINT (src-tauri/src/update.rs). The
#     TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) secrets are the fork's own key,
#     whose public half is UPDATER_PUBKEY below. Losing that secret means a
#     new key pair, and installed builds trust only the old one: they need
#     one reinstall by hand.
#
# The Google OAuth pair arrives as the OMACAL_CLIENT_ID/SECRET repository
# secrets (the same pair upstream's release builds embed), read at compile
# time exactly as in release.yml.

name: fork-macos

on:
  # After ci passes on main, so a broken rebase never replaces a working build.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # From main it publishes; from any other branch it builds and checks only.
  workflow_dispatch:

permissions:
  contents: write

# Queued, not cancelled: a run cancelled mid-publish could leave the
# previous release deleted or the new one half-uploaded.
concurrency:
  group: fork-macos
  cancel-in-progress: false

jobs:
  build:
    # Only a ci run from a push to this repository's own main counts. A
    # workflow_run fires for pull_request runs too, including from other
    # forks, and building their head here would hand that code the secrets
    # and a write token.
    if: >-
      github.repository == 'scowalt/omacal' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUNDLE: target/aarch64-apple-darwin/release/bundle
      UPDATER_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ0MjdENjNDRThFRDcwRTIKUldUaWNPM29QTlluUkgwYzgxbzNtLzAxTzVxRENiQmk2dmQyRDdEaVYwblNTeHQrcVRZNXFwbVEK
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm --prefix ui ci

      # Both places the version lives: tauri.conf.json (through the overlay)
      # is what the app and the updater compare; Cargo.toml is what the CLI's
      # `doctor` compares and what the skill refresh keys on.
      - name: Fork version
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json)
          version="$base-fork.$GITHUB_RUN_NUMBER"
          sed -i '' "s/^version = \"$base\"$/version = \"$version\"/" src-tauri/Cargo.toml
          grep -qx "version = \"$version\"" src-tauri/Cargo.toml || {
            echo "src-tauri/Cargo.toml's version is not $base" >&2
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$version"

      - name: Fork overlay for tauri.conf.json
        run: |
          cat > "$RUNNER_TEMP/fork.conf.json" <<EOF
          {
            "version": "$VERSION",
            "bundle": {
              "targets": ["app"],
              "createUpdaterArtifacts": true,
              "macOS": { "signingIdentity": "-" }
            },
            "plugins": {
              "updater": {
                "pubkey": "$UPDATER_PUBKEY",
                "endpoints": ["https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"]
              }
            }
          }
          EOF
          cat "$RUNNER_TEMP/fork.conf.json"

      # The CLI ui/package-lock.json pins, for release.yml's reason: a new
      # bundler is a change made through the lockfile, not one a run picks up.
      - name: Build the app
        env:
          OMACAL_CLIENT_ID: ${{ secrets.OMACAL_CLIENT_ID }}
          OMACAL_CLIENT_SECRET: ${{ secrets.OMACAL_CLIENT_SECRET }}
          OMACAL_LATEST_RELEASE_ENDPOINT: https://api.github.com/repos/${{ github.repository }}/releases/latest
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ui/node_modules/.bin/tauri build \
            --target aarch64-apple-darwin \
            --config "$RUNNER_TEMP/fork.conf.json"

      - name: Check the app
        run: |
          app="$BUNDLE/macos/OmaCal.app"
          bin="$app/Contents/MacOS/omacal"
          lipo -archs "$bin"
          lipo -archs "$bin" | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q '^Signature=adhoc$'
          shown=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          [ "$shown" = "$VERSION" ] || { echo "the app says $shown, not $VERSION" >&2; exit 1; }
          grep -q "$VERSION" "$bin" || { echo "$VERSION is not compiled in" >&2; exit 1; }
          # Grepped, never printed. An app without the pair cannot sign in
          # on a Mac that has no ~/.config/omacal/config.toml.
          if ! grep -q 'apps\.googleusercontent\.com' "$bin"; then
            echo "no OAuth client compiled in; are the OMACAL_CLIENT_* secrets set?" >&2
            exit 1
          fi
          # Both halves of the update check point here, not upstream.
          grep -q "api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" "$bin" || {
            echo "the update notice does not read this fork's releases" >&2
            exit 1
          }
          grep -q "github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" "$bin" || {
            echo "the updater does not read this fork's latest.json" >&2
            exit 1
          }
          echo "LSMinimumSystemVersion: $(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")"

      # The bundler only warns when the signing key is not the pubkey's pair,
      # and the installed app would then refuse every update. Verified here
      # against the pubkey the app was built with.
      - name: Verify the update signature
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install minisign
          echo "$UPDATER_PUBKEY" | base64 -d > "$RUNNER_TEMP/updater.pub"
          base64 -d < "$BUNDLE/macos/OmaCal.app.tar.gz.sig" > "$RUNNER_TEMP/updater.minisig"
          minisign -V -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/updater.minisig" \
            -m "$BUNDLE/macos/OmaCal.app.tar.gz"

      # The zip is for installing by hand, where one `ditto -x -k` does it; the
      # .app.tar.gz, its .sig and latest.json are what the updater reads.
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent "$BUNDLE/macos/OmaCal.app" dist/omacal-fork-aarch64.app.zip
          cp "$BUNDLE/macos/OmaCal.app.tar.gz" dist/omacal-fork-aarch64.app.tar.gz
          cp "$BUNDLE/macos/OmaCal.app.tar.gz.sig" dist/omacal-fork-aarch64.app.tar.gz.sig
          jq -n \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat dist/omacal-fork-aarch64.app.tar.gz.sig)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/omacal-fork-aarch64.app.tar.gz" \
            '{version: $version, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > dist/latest.json
          cat dist/latest.json
          shasum -a 256 dist/*

      # One release at a time, as before: the new one goes up first, marked
      # latest, and only then are the older fork releases and their tags
      # removed. The tag is made with the workflow token, which starts no
      # workflows, so release.yml's v* trigger does not fire for it.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/omacal-fork-aarch64.app.zip"
          commits=$(gh api "repos/x3me/omacal/compare/main...${GITHUB_REPOSITORY%%/*}:${GITHUB_REPOSITORY#*/}:$SHA" \
            --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          OmaCal $VERSION for Apple Silicon (M3 Pro, A18 Pro), built from \`${SHA:0:7}\`.

          On top of upstream [x3me/omacal](https://github.com/x3me/omacal) main:

          ${commits:-- nothing; this is upstream as-is}

          Installed builds update themselves from this repository: the app shows a banner when a newer one is out, and its Update button installs it.

          First install (curl leaves no quarantine flag, so Gatekeeper does not block the ad-hoc signature):

          \`\`\`sh
          curl -fL -o /tmp/omacal.zip $url
          pgrep -x omacal >/dev/null && osascript -e 'quit app "OmaCal"'; rm -rf /Applications/OmaCal.app
          ditto -x -k /tmp/omacal.zip /Applications && open /Applications/OmaCal.app
          \`\`\`

          Each build has a new ad-hoc signature, so after an update macOS may ask whether OmaCal can use its saved Google sign-in in the Keychain. Choose **Always Allow**.
          EOF
          tag="v$VERSION"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --latest \
            --title "OmaCal $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          stale=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep -E -e '-fork\.[0-9]+$' -e '^fork-latest$' | grep -vx "$tag" || true)
          for old in $stale; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
